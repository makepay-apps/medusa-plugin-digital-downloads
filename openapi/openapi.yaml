    put:
      operationId: streamLocalDigitalAssetUpload
      tags: [Admin catalog]
      summary: Stream upload bytes to a protected local staging object
      description: Bytes are hashed while streaming to a temporary file and atomically promoted; the server never buffers the complete body.
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
