components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminSession:
      type: apiKey
      in: cookie
      name: connect.sid
    adminApiKey:
      type: apiKey
      in: header
      name: x-medusa-access-token
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    customerSession:
      type: apiKey
      in: cookie
      name: connect.sid
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
    grantBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque digital download grant
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    VariantId:
      name: variant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Order:
      name: order
      in: query
      description: Sort field; prefix with `-` for descending order.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Search:
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: URL-safe 8-255 character retry key.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,254}$"
    Range:
      name: Range
      in: header
      required: false
      description: Exactly one byte range. Multiple ranges are rejected.
      schema:
        type: string
        pattern: "^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$"
        examples: ["bytes=0-1048575"]
  headers:
    PrivateNoStore:
      description: Sensitive response cache policy.
      schema:
        type: string
        const: "private, no-store, max-age=0"
    AcceptRanges:
      schema:
        type: string
        const: bytes
    ContentRange:
      schema:
        type: string
        pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$"
    RetryAfter:
      schema:
        type: integer
        minimum: 1
  responses:
    Error:
      description: Safe error response; internal details are redacted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication or capability is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but operation is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Valid JSON that fails domain validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RangeNotSatisfiable:
      description: Malformed, multiple, or unsatisfiable range.
      headers:
        Content-Range:
          description: Current complete asset size when available.
          schema:
            type: string
            pattern: "^bytes \\*/[0-9]+$"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BinaryContent:
      description: Complete preview bytes.
      headers:
        Accept-Ranges:
          $ref: "#/components/headers/AcceptRanges"
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    PartialBinaryContent:
      description: Requested preview range.
      headers:
        Accept-Ranges:
          $ref: "#/components/headers/AcceptRanges"
        Content-Range:
          $ref: "#/components/headers/ContentRange"
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    PrivateBinaryContent:
      description: Complete granted content.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Accept-Ranges:
          $ref: "#/components/headers/AcceptRanges"
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    PrivatePartialBinaryContent:
      description: Requested granted content range.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Accept-Ranges:
          $ref: "#/components/headers/AcceptRanges"
        Content-Range:
          $ref: "#/components/headers/ContentRange"
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    EntitlementPage:
      description: Paginated safe entitlements.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                required: [entitlements]
                properties:
                  entitlements:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entitlement"
    EntitlementDetail:
      description: Safe entitlement detail.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            type: object
            required: [entitlement]
            properties:
              entitlement:
                $ref: "#/components/schemas/Entitlement"
    AdminEntitlementPage:
      description: Paginated admin entitlement projections with secret material removed.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                required: [entitlements]
                properties:
                  entitlements:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminEntitlement"
    AdminEntitlementDetail:
      description: Admin operational entitlement with secret material removed.
      content:
        application/json:
          schema:
            type: object
            required: [entitlement]
            properties:
              entitlement:
                $ref: "#/components/schemas/AdminEntitlement"
    GrantCreated:
      description: Short-lived bearer grant. Never cache or log the token.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            type: object
            required: [grant]
            properties:
              grant:
                $ref: "#/components/schemas/Grant"
    LicenseLifecycle:
      description: Safe license and activation state. The submitted key is never echoed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LicenseLifecycleResponse"
    ProductConfigPage:
      description: Paginated product configs.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                required: [product_configs]
                properties:
                  product_configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductConfig"
    ReleasePage:
      description: Paginated releases.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Release"
    AssetPage:
      description: Paginated safe assets.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
    LicensePolicyPage:
      description: Paginated policies with safe key counts.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                required: [license_policies]
                properties:
                  license_policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/LicensePolicy"
