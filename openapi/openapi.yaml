openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Medusa Digital Downloads API
  version: 0.4.0
  summary: Native Medusa v2 APIs for protected digital delivery and licensing.
  description: |
    Admin catalog, storage, entitlement, audit, and reporting APIs plus Store APIs
    for previews, customer libraries, opaque guest capabilities, protected content,
    and key-based license activation. Raw storage locations, hashes, credentials,
    and encrypted material are never part of a response schema.
  contact:
    name: MakePay
    url: https://makepay.io
  license:
    name: MIT
servers:
  - url: http://localhost:9000
    description: Local Medusa server
tags:
  - name: Public metadata
  - name: Admin settings
  - name: Admin catalog
  - name: Admin licenses
  - name: Admin entitlements
  - name: Admin reporting
  - name: Store library
  - name: Guest access
  - name: Protected content
  - name: License client
paths:
  /store/digital-downloads:
    get:
      operationId: getDigitalDownloadsPluginMetadata
      tags: [Public metadata]
      summary: Get public plugin metadata
      security: []
      responses:
        "200":
          description: Fixed capability and attribution metadata.
          content:
            application/json:
              schema:
                type: object
                required: [plugin]
                properties:
                  plugin:
                    $ref: "#/components/schemas/PluginMetadata"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/products/{variant_id}:
    get:
      operationId: getDigitalProductPreviewMetadata
      tags: [Public metadata]
      summary: Get sanitized digital metadata for a Medusa variant
      security:
        - publishableKey: []
        - {}
      parameters:
        - $ref: "#/components/parameters/VariantId"
        - name: locale
          in: query
          schema:
            type: string
            maxLength: 35
      responses:
        "200":
          description: Public product and preview metadata.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    $ref: "#/components/schemas/PublicDigitalProduct"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/previews/{asset_id}:
    get:
      operationId: streamDigitalProductPreview
      tags: [Protected content]
      summary: Stream an explicitly public preview asset
      security:
        - publishableKey: []
        - {}
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/BinaryContent"
        "206":
          $ref: "#/components/responses/PartialBinaryContent"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/library:
    get:
      operationId: listCustomerDigitalLibrary
      tags: [Store library]
      summary: List the signed-in customer's durable entitlements
      security:
        - customerBearer: []
        - customerSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          explode: true
          schema:
            type: array
            maxItems: 5
            items:
              $ref: "#/components/schemas/EntitlementStatus"
        - name: kind
          in: query
          explode: true
          schema:
            type: array
            maxItems: 4
            items:
              $ref: "#/components/schemas/DigitalProductKind"
        - name: order_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          $ref: "#/components/responses/EntitlementPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/entitlements/{id}:
    get:
      operationId: getCustomerDigitalEntitlement
      tags: [Store library]
      summary: Get one owned entitlement
      description: Foreign and ownerless entitlements return the same 404 as an unknown ID.
      security:
        - customerBearer: []
        - customerSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EntitlementDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/entitlements/{id}/grants:
    post:
      operationId: createCustomerDownloadGrant
      tags: [Store library]
      summary: Mint a short-lived grant for an owned asset
      security:
        - customerBearer: []
        - customerSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRequest"
      responses:
        "201":
          $ref: "#/components/responses/GrantCreated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/guest/access:
    post:
      operationId: exchangeGuestDigitalAccess
      tags: [Guest access]
      summary: Resolve an opaque guest purchase capability
      description: |
        The capability and optional order email are accepted only in the JSON
        body, never in a URL or header. `email` is required when the merchant's
        `require_order_email_match` setting is enabled, which is the default.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccessRequest"
      responses:
        "200":
          $ref: "#/components/responses/EntitlementDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/guest/grants:
    post:
      operationId: createGuestDownloadGrant
      tags: [Guest access]
      summary: Mint an asset grant using a guest capability
      description: |
        `email` is required when `require_order_email_match` is enabled (the
        default) and must match the email snapshotted on the order entitlement.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestGrantRequest"
      responses:
        "201":
          $ref: "#/components/responses/GrantCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/content/{asset_id}:
    get:
      operationId: streamGrantedDigitalContent
      tags: [Protected content]
      summary: Redeem a bearer grant and proxy private content
      description: |
        The bearer is accepted only in `Authorization`. Query-string capabilities,
        multiple ranges, unsafe local paths, and a provider that ignores an expected
        range are rejected. This endpoint never redirects to a private origin. Grant
        use and logical-download consumption are committed before response headers or
        the first body byte are written. After that commit, the source is piped with
        backpressure and no response-body buffer; a disconnect or later stream failure
        remains consumed and is recorded as a failed transfer.
      security:
        - grantBearer: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/PrivateBinaryContent"
        "206":
          $ref: "#/components/responses/PrivatePartialBinaryContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/licenses/{id}/reveal:
    post:
      operationId: revealOwnedLicenseKey
      tags: [Store library]
      summary: Reveal a license key after ownership proof
      description: |
        Customer owners use their normal authentication. Guest callers send
        `guest_token` and, when `require_order_email_match` is enabled (the
        default), the matching order email as `guest_email`.
      security:
        - customerBearer: []
        - customerSession: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                guest_token:
                  $ref: "#/components/schemas/GuestToken"
                guest_email:
                  $ref: "#/components/schemas/OrderEmail"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: One-time plaintext license response. Never cache.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                type: object
                required: [license_key]
                properties:
                  license_key:
                    type: string
                    minLength: 8
                    maxLength: 1024
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/licenses/activate:
    post:
      operationId: activateDigitalLicense
      tags: [License client]
      summary: Activate a license on an instance
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseActivateRequest"
      responses:
        "200":
          $ref: "#/components/responses/LicenseLifecycle"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/licenses/deactivate:
    post:
      operationId: deactivateDigitalLicense
      tags: [License client]
      summary: Deactivate a license instance
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseDeactivateRequest"
      responses:
        "200":
          $ref: "#/components/responses/LicenseLifecycle"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/licenses/heartbeat:
    post:
      operationId: heartbeatDigitalLicense
      tags: [License client]
      summary: Renew an active instance heartbeat
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseHeartbeatRequest"
      responses:
        "200":
          $ref: "#/components/responses/LicenseLifecycle"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /store/digital-downloads/licenses/validate:
    post:
      operationId: validateDigitalLicense
      tags: [License client]
      summary: Validate a key and optionally an instance
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseValidateRequest"
      responses:
        "200":
          description: Validation result. Invalid keys return `valid:false` without a secret oracle.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseValidationResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/settings:
    get:
      operationId: getDigitalDownloadsSettings
      tags: [Admin settings]
      summary: Get sanitized plugin settings
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      responses:
        "200":
          description: Settings without credentials, secret references, or storage topology.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDigitalDownloadsSettings
      tags: [Admin settings]
      summary: Update persisted delivery settings
      description: Deployment storage configuration is read-only and represented only by safe provider and configured diagnostics.
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
      responses:
        "200":
          description: Updated sanitized settings.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettings"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/settings/test-storage:
    post:
      operationId: testDigitalDownloadsStorage
      tags: [Admin settings]
      summary: Run a storage health or write/read/delete probe
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operation:
                  type: string
                  enum: [health, write_read_delete]
                  default: health
      responses:
        "200":
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                required: [storage_test]
                properties:
                  storage_test:
                    $ref: "#/components/schemas/StorageTest"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/product-configs:
    get:
      operationId: listDigitalProductConfigs
      tags: [Admin catalog]
      summary: List native digital product configurations
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Search"
        - name: product_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: variant_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, archived]
        - name: delivery_type
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryType"
      responses:
        "200":
          $ref: "#/components/responses/ProductConfigPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDigitalProductConfig
      tags: [Admin catalog]
      summary: Create and link one digital config to Medusa variants
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductConfigInput"
      responses:
        "201":
          description: Config created and variant links committed.
          content:
            application/json:
              schema:
                type: object
                required: [product_config]
                properties:
                  product_config:
                    $ref: "#/components/schemas/ProductConfig"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/product-configs/{id}:
    get:
      operationId: getDigitalProductConfig
      tags: [Admin catalog]
      summary: Get a config with releases, safe assets, and license policy
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Expanded configuration.
          content:
            application/json:
              schema:
                type: object
                required: [product_config]
                properties:
                  product_config:
                    $ref: "#/components/schemas/ProductConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDigitalProductConfig
      tags: [Admin catalog]
      summary: Update a config and its Medusa variant links
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductConfigPatch"
      responses:
        "200":
          description: Updated config.
          content:
            application/json:
              schema:
                type: object
                required: [product_config]
                properties:
                  product_config:
                    $ref: "#/components/schemas/ProductConfig"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDigitalProductConfig
      tags: [Admin catalog]
      summary: Delete a config and dismiss its Medusa links
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/releases:
    get:
      operationId: listDigitalProductReleases
      tags: [Admin catalog]
      summary: List digital product releases
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - name: product_config_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, ready, published, retired]
      responses:
        "200":
          $ref: "#/components/responses/ReleasePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDigitalProductRelease
      tags: [Admin catalog]
      summary: Create a draft or ready digital product release
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseInput"
      responses:
        "201":
          description: Release created.
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release:
                    $ref: "#/components/schemas/Release"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/releases/{id}:
    get:
      operationId: getDigitalProductRelease
      tags: [Admin catalog]
      summary: Get a digital product release
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Expanded release.
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release:
                    $ref: "#/components/schemas/Release"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDigitalProductRelease
      tags: [Admin catalog]
      summary: Update a draft or ready release
      description: Published release history is immutable.
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleasePatch"
      responses:
        "200":
          description: Updated release.
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release:
                    $ref: "#/components/schemas/Release"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDigitalProductRelease
      tags: [Admin catalog]
      summary: Delete a non-published, non-current release
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/releases/{id}/publish:
    post:
      operationId: publishDigitalProductRelease
      tags: [Admin catalog]
      summary: Validate readiness and atomically make a release current
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                make_active:
                  type: boolean
                  default: true
                notify_existing_customers:
                  type: boolean
                  default: false
                  enum: [false]
                  description: Existing-customer release notifications are not supported.
      responses:
        "200":
          description: Published release.
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release:
                    $ref: "#/components/schemas/Release"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/assets:
    get:
      operationId: listDigitalAssets
      tags: [Admin catalog]
      summary: List safe asset metadata
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Search"
        - name: release_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: product_config_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/AssetRole"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AssetStatus"
      responses:
        "200":
          $ref: "#/components/responses/AssetPage"
        default:
          $ref: "#/components/responses/Error"
  /admin/digital-downloads/assets/{id}:
    get:
      operationId: getDigitalAsset
      tags: [Admin catalog]
      summary: Get safe digital asset metadata
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Asset metadata without provider key or origin.
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset:
                    $ref: "#/components/schemas/Asset"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDigitalAssetMetadata
      tags: [Admin catalog]
      summary: Update asset metadata outside published release history
      security:
        - adminBearer: []
        - adminSession: []
        - adminApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetPatch"
      responses:
        "200":
          description: Updated asset.
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset:
                    $ref: "#/components/schemas/Asset"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
